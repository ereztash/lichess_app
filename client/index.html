<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#e9e4d8" />

    <!--
      THE FACE THIS INTERFACE IS SET IN, FETCHED BEFORE THE FIRST PAINT RATHER THAN AFTER IT.

      `font-display: swap` renders the fallback first and re-renders when the real face lands. For
      Latin that costs a flash; for THIS interface it cost a layout shift, because a Hebrew line
      that fits in two lines of Noto Sans Hebrew takes three in the fallback. Measured in Chromium
      on `/play`: the context ribbon painted 88px tall, dropped to 65px at 60ms when the font
      arrived, and the whole workbench -- the board included -- moved 23px up. CLS 0.0023 -> 0.0137.

      IT WAS FOUND BY GIVING THE PROSE A MEASURE, and it was there before that: a column with no
      max width has no line count to change, so the defect had nothing to move. Reserving the
      band's height would have paid 23px of permanent space above a board whose last rank is
      already close to the fold; fetching the face first removes the reflow for every string in
      the product instead of hiding it in one band.

      ONE FILE, NOT NINE. Only the 400-weight Hebrew subset is preloaded: 12 kB, and the face that
      renders nearly every glyph on every screen. The Latin subsets and the heavier weights stay
      on the ordinary path, because a preload that is not on the critical path is bytes taken from
      one that is.
    -->
    <link
      rel="preload"
      href="/fonts/noto-sans-hebrew-400-hebrew.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Decision Lab — החלטה, ואז חשיפה</title>

    <!--
      THE PROMISE, AND WHY THIS FILE HOLDS THE ONE COPY NOTHING COMPILES.

      Every sentence below is `PROMISE` / `PROMISE_SHORT` from `shared/promise.ts`, which is where
      the front door and the share-card builder read theirs. This file cannot import it -- it is
      static HTML, read by crawlers before any script runs -- so it carries the only copy in the
      repository that a compiler will not keep in step. `the-link-someone-was-sent.test.ts` keeps
      it in step instead, and fails the moment the two disagree.

      IT USED TO LEAD WITH THE CONSTRUCT: "זה מודד מתי לא ידעתם שאתם לא יודעים". That sentence is
      true, and "not knowing that you did not know" is not a problem a chess player recognises
      having before someone names it for them. The chain now names the problem in board terms --
      what an engine can say, and the thing it structurally cannot reach -- and the construct
      arrives later on the page, as a consequence rather than as an introduction.

      An earlier version also promised "אתם מחליטים וכותבים את הקריאה שלכם". The middle clause
      stopped being true when the ask rule became a sample. What is invariant, on every decision
      and in every loop, is the ordering: the decision is committed before the engine says
      anything. That is the third sentence here, and it is the third sentence on the front door.
    -->
    <meta
      name="description"
      content="מנוע יכול להגיד איזה מהלך היה טוב יותר. הוא לא יודע מה קרה אצלכם בדרך לבחירה. כאן ההחלטה נרשמת לפני שהמנוע מדבר."
    />

    <!--
      THE SHARE CARD, AND STAGE ZERO OF THE ACQUISITION PATH.

      There was no Open Graph or Twitter metadata at all, so a link pasted into a DM, a post or a
      group rendered as a bare URL: no title, no image, and on most surfaces not even the
      description above. For a trial whose entry vector IS a message with a link in it, that is
      the first screen of the funnel and it was empty.

      THE WORDING IS A DISTINCTION, NOT A DIAGNOSIS. It says what this records and what an engine
      cannot reach, never what it will find: `chose-past-it` may not occur on any given decision,
      and a card promising "we will show you the move you saw and rejected" would make the
      experiment unfalsifiable -- every player arriving expecting a result the instrument cannot
      guarantee.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Decision Lab" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="Decision Lab — החלטה, ואז חשיפה" />
    <meta
      property="og:description"
      content="מנוע יכול להגיד איזה מהלך היה טוב יותר. הוא לא יודע מה קרה אצלכם בדרך לבחירה. כאן ההחלטה נרשמת לפני שהמנוע מדבר."
    />
    <meta property="og:image" content="/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Decision Lab — החלטה, ואז חשיפה. מנוע יכול להגיד איזה מהלך היה טוב יותר; הוא לא יודע מה קרה אצלכם בדרך לבחירה. כאן ההחלטה נרשמת לפני שהמנוע מדבר."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Decision Lab — החלטה, ואז חשיפה" />
    <meta
      name="twitter:description"
      content="מנוע יכול להגיד איזה מהלך היה טוב יותר. הוא לא יודע מה קרה אצלכם בדרך לבחירה. כאן ההחלטה נרשמת לפני שהמנוע מדבר."
    />
    <meta name="twitter:image" content="/share-card.png" />
