name: Pressure Exposure Frozen Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pressure-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis-only dependencies
        run: python -m pip install --quiet python-chess==1.999 zstandard pandas scikit-learn
      - name: Prepare runner-only path aliases
        run: ln -s research/learning-v3 learning-v3
      - name: Run frozen pressure-exposure test
        env:
          PYTHONPATH: research/measurement
        run: python research/learning-v3/pressure_exposure_test.py
