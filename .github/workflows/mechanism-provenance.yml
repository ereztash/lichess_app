name: Mechanism Provenance

on:
  pull_request:
    paths:
      - "research/mechanism/**"
      - ".github/workflows/mechanism-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mechanism-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rstarstar-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy pandas pyarrow python-chess zstandard scikit-learn pysubgroup
      - name: Execute exact-frame R** mechanism decomposition
        run: |
          set -euo pipefail
          python research/mechanism/analysis/rstarstar_provenance_blitz.py \
            --owner research/mechanism/data/decisions_erez281.parquet \
            --population research/mechanism/data/decisions_population_2026-06.parquet \
            --owner-scored research/mechanism/data/scored_erez281_sf171_d12_mpv3.jsonl.zst \
            --population-scored research/mechanism/data/scored_population_sf171_d12_mpv3.jsonl.zst \
            --out /tmp/rstarstar_provenance_blitz.json
          echo "RESULT_FILE=/tmp/rstarstar_provenance_blitz.json"
