name: Verify

on:
  # pull_request covers every branch that has a PR open; push covers the default branch.
  # Listing "**" under push as well made every run fire twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A REAL DATABASE, because the record layer's own tests cannot prove it works without one.
    #
    # `tests/server/drizzle-store.test.ts` skips when DATABASE_URL is unset, and for most of this
    # project's life that was every run anywhere -- DrizzleRecordStore had never executed a
    # statement. Running it locally once proved the class works; it does not stop the next change
    # from breaking it. That is the same shape as Layer C, whose unit tests passed for months
    # while no router imported it.
    #
    # MySQL 8 rather than MariaDB: the deployment target is MySQL, and the point of this service
    # is to be the thing the code will actually meet. The local run that first exercised this used
    # MariaDB 10.11, so the two together also say the store is not depending on either one.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: decision_lab
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `ci`, NOT `install`. `npm install` is free to resolve a dependency to something the lock
      # file does not name -- which means CI could be testing a tree no developer has, and a
      # green run would be evidence about that tree rather than about the one that ships. `npm ci`
      # installs the lock exactly and fails if the two have drifted apart.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # WHAT THE BUILD SHIPS, CHECKED AGAINST WHAT IS KNOWN ABOUT IT.
      #
      # `--omit=dev` because the question this step asks is about the deployment, not the
      # workbench: a vulnerability in vitest is not conveyed to anybody. `--audit-level=high`
      # because a step that fails on every low advisory gets disabled within a month, and one
      # that never fails is decoration.
      #
      # This can go red on a day nothing in this repository changed. That is the step working:
      # an advisory published against a dependency this build ships is news whether or not
      # somebody happened to push.
      - name: Audit the dependencies this build ships
        run: npm audit --omit=dev --audit-level=high
      # A REAL BROWSER, for the same reason the job runs a real database.
      #
      # `tests/layout/*` measure boxes, and jsdom reports every box as 0x0 -- which is how a
      # bucket label shipped collapsed to one glyph per line, and a signed gap shipped with its
      # minus on the wrong side, both past a fully green suite. `tests/layout/browser.ts` THROWS
      # when no Chromium is present rather than skipping, so a runner without this step fails
      # loudly instead of reporting green on tests that never ran.
      #
      # `--with-deps` SHELLS OUT TO apt, AND apt IS NOT PART OF THIS PROJECT. It refreshes every
      # source the runner image has configured -- including packages.microsoft.com, which has
      # nothing to do with Chromium -- and `apt-get update` fails the whole step if any one of
      # them is unreachable. That is exactly what happened: a 403 from Microsoft's mirror took
      # `verify` down before a single test ran, on a diff that touches no CI, no browser and no
      # system package.
      #
      # So the apt half is allowed to fail and the browser is installed either way. This cannot
      # produce a quiet green: the shared libraries Chromium needs are already on the
      # ubuntu-latest image, and if they ever are not, `browser.ts` THROWS -- it is written to
      # refuse rather than skip, for the reason directly above. A missing browser still fails
      # this job loudly; it just no longer fails because a package index unrelated to this
      # repository was having a bad minute.
      - name: Install Chromium for the layout tests
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Typecheck
        run: npm run check
      # Schema from the generated SQL, not from a hand-written file that can drift from schema.ts.
      # `--> statement-breakpoint` is drizzle-kit's separator and is not SQL.
      #
      # EVERY migration, in order, not just 0000. This used to load the initial one alone and call
      # it the schema, which is only the schema until a second migration exists -- and one already
      # did. The failure it produces is `Unknown column ... in 'field list'` from a suite that
      # passes locally, because locally DATABASE_URL is unset and the database tests skip.
      # The glob sorts lexicographically, which is what the 0000/0001/0002 numbering is for.
      - name: Build the database schema
        run: |
          set -e
          for migration in drizzle/migrations/*.sql; do
            echo "applying $migration"
            sed 's/--> statement-breakpoint//' "$migration" \
              | mysql -h 127.0.0.1 -P 3306 -u root decision_lab
          done
      # BEFORE THE TESTS, not after them, and the reason is one test.
      #
      # `tests/layout/content-security-policy.layout.test.ts` serves `dist/public` under the exact
      # policy `vercel.json` sends and loads it in a real browser. It cannot measure a build that
      # does not exist yet, and it throws rather than skipping -- a CSP test that quietly did not
      # run is how a policy that breaks the engine reaches production.
      - name: Build
        run: npm run build
      - name: Test
        # With DATABASE_URL set, the database suite RUNS instead of skipping. If the service is
        # missing or the schema failed to load, those tests fail rather than quietly skipping --
        # a suite that passes because it did not run is the exact R2 failure this repo is about.
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/decision_lab
        run: npm test
      - name: Gates
        run: npm run gates
      - name: Gate positive controls (each must go red)
        run: npm run gates:controls
      # The budget measures the BUILD's output, so it can only run after it. Vite already warns
      # about chunks over 500 kB and has warned on every build for a long time, which is what a
      # warning nobody can fail becomes. This one fails.
      - name: Bundle budget
        run: npm run bundle:budget
