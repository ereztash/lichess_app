name: Verify

on:
  # pull_request covers every branch that has a PR open; push covers the default branch.
  # Listing "**" under push as well made every run fire twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository. Read the checkout and no more.
permissions:
  contents: read

# A push that supersedes a running verification cancels it: the run was about a tree that no longer
# heads the branch, and the queue it holds is the queue the next run waits in. Not on main -- there
# every run is about a commit that deployed, and each deserves its own verdict.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A REAL DATABASE, because the record layer's own tests cannot prove it works without one.
    #
    # `tests/server/drizzle-store.test.ts` skips when DATABASE_URL is unset, and for most of this
    # project's life that was every run anywhere -- DrizzleRecordStore had never executed a
    # statement. Running it locally once proved the class works; it does not stop the next change
    # from breaking it. That is the same shape as Layer C, whose unit tests passed for months
    # while no router imported it.
    #
    # MySQL 8 rather than MariaDB: the deployment target is MySQL, and the point of this service
    # is to be the thing the code will actually meet. The local run that first exercised this used
    # MariaDB 10.11, so the two together also say the store is not depending on either one.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: decision_lab
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      # PINNED TO A COMMIT, NOT A TAG -- see docs/DEPENDENCY_POLICY.md. The version is in the
      # comment so a reader can tell what the hash is; Dependabot keeps both in step.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # `engines.node` in package.json: the one statement of which Node this runs on. Vercel
          # reads the same field, so CI and the function cannot disagree about the major.
          node-version-file: package.json
      # `ci`, NOT `install`. `npm install` is free to resolve a dependency to something the lock
      # file does not name -- which means CI could be testing a tree no developer has, and a
      # green run would be evidence about that tree rather than about the one that ships. `npm ci`
      # installs the lock exactly and fails if the two have drifted apart.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # A REAL BROWSER, for the same reason the job runs a real database.
      #
      # `tests/layout/*` measure boxes, and jsdom reports every box as 0x0 -- which is how a
      # bucket label shipped collapsed to one glyph per line, and a signed gap shipped with its
      # minus on the wrong side, both past a fully green suite. `tests/layout/browser.ts` THROWS
      # when no Chromium is present rather than skipping, so a runner without this step fails
      # loudly instead of reporting green on tests that never ran.
      #
      # `--with-deps` SHELLS OUT TO apt, AND apt IS NOT PART OF THIS PROJECT. It refreshes every
      # source the runner image has configured -- including packages.microsoft.com, which has
      # nothing to do with Chromium -- and `apt-get update` fails the whole step if any one of
      # them is unreachable. That is exactly what happened: a 403 from Microsoft's mirror took
      # `verify` down before a single test ran, on a diff that touches no CI, no browser and no
      # system package.
      #
      # So the apt half is allowed to fail and the browser is installed either way. This cannot
      # produce a quiet green: the shared libraries Chromium needs are already on the
      # ubuntu-latest image, and if they ever are not, `browser.ts` THROWS -- it is written to
      # refuse rather than skip, for the reason directly above. A missing browser still fails
      # this job loudly; it just no longer fails because a package index unrelated to this
      # repository was having a bad minute.
      - name: Install Chromium for the layout tests
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Typecheck
        run: npm run check
      # THE SAME COMPILER OVER A FILE THAT MUST NOT COMPILE. A green typecheck and a typecheck that
      # is not running look identical from outside, which is the one thing `RNL-04` exists to make
      # impossible. `!` inverts the exit, exactly as the gate controls invert theirs.
      - name: Typecheck positive control (must fail)
        run: |
          if npm run check:control; then
            echo "::error::the typecheck PASSED over a file with a type error. It is not running."
            exit 1
          fi
          echo "control went red, as required"
      # Schema from the generated SQL, not from a hand-written file that can drift from schema.ts.
      # `--> statement-breakpoint` is drizzle-kit's separator and is not SQL.
      #
      # EVERY migration, in order, not just 0000. This used to load the initial one alone and call
      # it the schema, which is only the schema until a second migration exists -- and one already
      # did. The failure it produces is `Unknown column ... in 'field list'` from a suite that
      # passes locally, because locally DATABASE_URL is unset and the database tests skip.
      # The glob sorts lexicographically, which is what the 0000/0001/0002 numbering is for.
      - name: Build the database schema
        run: |
          set -e
          for migration in drizzle/migrations/*.sql; do
            echo "applying $migration"
            sed 's/--> statement-breakpoint//' "$migration" \
              | mysql -h 127.0.0.1 -P 3306 -u root decision_lab
          done
      # BEFORE THE TESTS, not after them, and the reason is one test.
      #
      # `tests/layout/content-security-policy.layout.test.ts` serves `dist/public` under the exact
      # policy `vercel.json` sends and loads it in a real browser. It cannot measure a build that
      # does not exist yet, and it throws rather than skipping -- a CSP test that quietly did not
      # run is how a policy that breaks the engine reaches production.
      - name: Build
        run: npm run build
      - name: Test
        # With DATABASE_URL set, the database suite RUNS instead of skipping. If the service is
        # missing or the schema failed to load, those tests fail rather than quietly skipping --
        # a suite that passes because it did not run is the exact R2 failure this repo is about.
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/decision_lab
        run: npm test
      - name: Gates
        run: npm run gates
      - name: Gate positive controls (each must go red)
        run: npm run gates:controls
      # The budget measures the BUILD's output, so it can only run after it. Vite already warns
      # about chunks over 500 kB and has warned on every build for a long time, which is what a
      # warning nobody can fail becomes. This one fails.
      - name: Bundle budget
        run: npm run bundle:budget
      # G-02's named gap. The same script over a fixture whose entry chunk is a kilobyte over the
      # ratchet and whose index.html eagerly preloads the engine: it must catch both.
      - name: Bundle budget positive control (must fail)
        run: |
          if npm run bundle:budget:control; then
            echo "::error::the bundle budget PASSED over an oversized fixture. It is not measuring."
            exit 1
          fi
          echo "control went red, as required"
      # WHAT THE BUILD SHIPS, CHECKED AGAINST WHAT IS KNOWN ABOUT IT.
      #
      # `--omit=dev` because the question this step asks is about the deployment, not the
      # workbench: a vulnerability in vitest is not conveyed to anybody. `--audit-level=high`
      # because a step that fails on every low advisory gets disabled within a month, and one
      # that never fails is decoration.
      #
      # This can go red on a day nothing in this repository changed. That is the step working:
      # an advisory published against a dependency this build ships is news whether or not
      # somebody happened to push.
      #
      # AND IT WENT RED FOUR TIMES IN TWO HOURS WITHOUT ANY ADVISORY EXISTING, which is the step
      # NOT working. Measured on runs 33845230721, 33854188110, 33855743082 and one before them:
      #
      #     npm warn audit 503 Service Unavailable - POST
      #       https://registry.npmjs.org/-/npm/v1/security/advisories/bulk
      #     npm error audit endpoint returned an error
      #     ##[error]Process completed with exit code 1
      #
      # WHAT THAT COST, AND WHY THIS STEP IS NOW LAST. It used to run BEFORE the build, the tests,
      # the gates and the bundle budget, and a job stops at its first failing step. So an outage at
      # npm did not cost the audit signal -- it cost EVERY signal: nothing in the commit was
      # verified, and a red `verify` meant "npm was busy" rather than anything about the code. The
      # two are indistinguishable to anybody reading the check.
      #
      # THE RETRY BELOW IS NOT ENOUGH ON ITS OWN, and run 33855743082 is the proof. The loop
      # behaved exactly as designed -- three attempts at 60s each rather than one at 300s, then a
      # red job naming the cause -- and it still failed, because the endpoint had been down for
      # twenty minutes rather than a moment. Four minutes of retries does not survive that, and no
      # number of retries that is honest would. Ordering is what survives it: with the audit last,
      # a sustained outage costs the audit and nothing else.
      #
      # THE MOVE ON ITS OWN WOULD HAVE WEAKENED IT, and the `if:` below is why it does not. A step
      # with no status condition is implicitly gated on `success()`, so once this one is last, a red
      # Typecheck, Build, Test, Gates or Bundle budget SKIPS it. That trades "an outage costs every
      # signal" for "any failing check costs the security signal" -- a different loss, not a smaller
      # one, and on the runs where a person most wants to know what the tree ships. `!cancelled()`
      # is the whole fix: the audit runs after earlier failures while still running last. Not
      # `always()`, which would also run it on a cancelled job and make a cancel take four minutes
      # to take effect.
      #
      # The audit does not need the build, the tests or the gates to have passed: it reads the
      # dependency tree that `Install dependencies` put on disk. If THAT is the step that failed
      # then this one fails too, and the job was red either way.
      #
      # SO NOTHING IS WEAKENED. Every step still runs, the job still fails if the audit fails, and
      # the audit is still as strict as it was. The only cost is that a real advisory is reported at
      # the end of the job instead of the start, which is ten minutes later on a run that was going
      # to be read by a person anyway.
      #
      # WHY THE FIVE-MINUTE STALL: `npm config get fetch-timeout` is 300000, and each failure took
      # exactly five minutes. `--fetch-timeout=60000` is why three attempts now cost less wall
      # clock than one did before.
      #
      # THE LOOP RETRIES AN OUTAGE AND NEVER AN ADVISORY, which is the only property that makes it
      # safe. A real finding exits 1 with a report on stdout and no endpoint error, so the `case`
      # falls through to `exit 1` on the FIRST attempt -- the step is exactly as strict as it was.
      # An unreachable endpoint says so in as many words, and only that string is retried.
      #
      # IT IS NOT UNFAILABLE. Three failures still end in `::error::` and a red job. What changes
      # is that a red job now means the endpoint is genuinely gone rather than momentarily busy.
      - name: Audit the dependencies this build ships
        if: ${{ !cancelled() }}
        run: |
          for attempt in 1 2 3; do
            if out=$(npm audit --omit=dev --audit-level=high --fetch-timeout=60000 2>&1); then
              printf '%s\n' "$out"
              exit 0
            fi
            printf '%s\n' "$out"
            case "$out" in
              # Only this. Anything else is a finding and is not retried.
              *"audit endpoint returned an error"*) ;;
              *) exit 1 ;;
            esac
            echo "npm's advisories endpoint is unavailable; attempt $attempt of 3"
            [ "$attempt" = 3 ] || sleep $((attempt * 20))
          done
          echo "::error::npm advisories endpoint unreachable after 3 attempts"
          exit 1
