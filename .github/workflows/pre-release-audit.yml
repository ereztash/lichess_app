name: Pre-release Gap Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run pre-release audit
        id: audit
        continue-on-error: true
        run: node scripts/pre-release-audit.mjs
      - name: Publish audit summary
        if: always()
        run: cat artifacts/pre-release-audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pre-release-gap-audit
          path: |
            artifacts/pre-release-audit.json
            artifacts/pre-release-audit.md
          if-no-files-found: error
      - name: Enforce release blockers
        if: steps.audit.outcome == 'failure'
        run: |
          echo 'Pre-release audit found P0/P1 blockers. See the job summary and artifact.' >&2
          exit 1
