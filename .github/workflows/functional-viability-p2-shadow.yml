name: Functional Viability P2 Shadow

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis-only dependencies
        run: python -m pip install --quiet python-chess==1.999 zstandard pandas scikit-learn scipy
      - name: Run frozen functional-viability P2 shadow test
        run: |
          python - <<'PY'
          import collections, io, json, sys
          from pathlib import Path
          import numpy as np
          import chess
          import zstandard
          from scipy.stats import spearmanr
          from sklearn.compose import ColumnTransformer
          from sklearn.impute import SimpleImputer
          from sklearn.linear_model import Ridge
          from sklearn.metrics import mean_absolute_error, r2_score, roc_auc_score
          from sklearn.model_selection import GroupKFold
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import OneHotEncoder, StandardScaler
          import pandas as pd

          sys.path.insert(0, str(Path('research/measurement').resolve()))
          import rule_classes as rc

          CORPUS = Path('research/learning-v3/corpus')
          TARGET_CLASSES = ['RC-04','RC-07','RC-08','RC-09','RC-11','RC-18','RC-20']
          OUTCOME_ONLY = {'RC-07','RC-08','RC-09'}

          def stream(name):
              with open(CORPUS / name, 'rb') as fh:
                  reader = zstandard.ZstdDecompressor().stream_reader(fh)
                  for line in io.TextIOWrapper(reader, encoding='utf-8'):
                      yield json.loads(line)

          best = {}
          for it in stream('item_bank.jsonl.zst'):
              if it.get('twin_of') or it.get('sham_of'):
                  continue
              if it.get('trigger_state') != 'positive' or it.get('rule_class') not in TARGET_CLASSES:
                  continue
              k = (it['rule_class'], it['position_id'])
              if k not in best or it.get('run_id') == 'sf171-full-corpus':
                  best[k] = it
          items = list(best.values())

          move_eval = collections.defaultdict(dict)
          for e in stream('engine_evaluations.jsonl.zst'):
              if e.get('kind') != 'move' or e.get('policy') != 'multipv-over-B' or e.get('xs') is None:
                  continue
              uci = (e.get('moves') or [None])[0]
              if uci:
                  move_eval[e['position_id']][uci] = float(e['xs'])

          def focal_square(board, rid):
              if rid == 'RC-04':
                  hit = rc._attacked_piece(board)
                  return None if hit is None else hit[0]
              hit = rc._designated_threat(board)
              return None if hit is None else hit[0]

          def focal_metrics_before_after(board, move, q0):
              actor = board.turn
              pre_support = len(board.attackers(actor, q0))
              pre_constraint = len(board.attackers(not actor, q0))
              pre_pressure = pre_support - pre_constraint
              q1 = move.to_square if move.from_square == q0 else q0
              b2 = board.copy(stack=False)
              b2.push(move)
              p = b2.piece_at(q1)
              exists = p is not None and p.color == actor
              post_support = len(b2.attackers(actor, q1)) if exists else 0
              post_constraint = len(b2.attackers(not actor, q1)) if exists else 0
              post_pressure = post_support - post_constraint
              post_viable = int(exists and not rc._in_bad_spot(b2, q1, actor))
              return {
                  'delta_pressure': post_pressure - pre_pressure,
                  'goal_path_viability_after': post_viable,
                  'support_redundancy_after': post_support,
                  'constraint_concentration_after': post_constraint,
              }

          rows = []
          item_counts = collections.Counter()
          move_counts = collections.Counter()
          missing_eval = 0
          for it in items:
              rid = it['rule_class']
              board = chess.Board(it['fen'])
              q0 = focal_square(board, rid)
              if q0 is None:
                  continue
              B = rc.BY_ID[rid].satisfying_moves(board, rc.EMPTY_CONTEXT)
              available = []
              for m in B:
                  xs = move_eval.get(it['position_id'], {}).get(m.uci())
                  if xs is None:
                      missing_eval += 1
                      continue
                  available.append((m, xs))
              if len(available) < 2 or it.get('v_star_xs') is None:
                  continue
              item_counts[rid] += 1
              for m, xs in available:
                  fm = focal_metrics_before_after(board, m, q0)
                  regret = float(it['v_star_xs']) - xs
                  rows.append({
                      'position_id': it['position_id'], 'rule_class': rid, 'move': m.uci(),
                      'regret': regret, 'harmful_025': int(regret >= 0.25),
                      'v_star': float(it['v_star_xs']),
                      'n_legal': float(it.get('n_legal') or len(list(board.legal_moves))),
                      'material_balance': it.get('material_balance'), 'piece_count': it.get('piece_count'),
                      **fm,
                  })
                  move_counts[rid] += 1

          if not rows:
              raise SystemExit('NO_ROWS')

          BASE_NUM = ['v_star','n_legal','material_balance','piece_count']
          SYS_NUM = ['delta_pressure','goal_path_viability_after','support_redundancy_after','constraint_concentration_after']

          def make_model(full):
              nums = BASE_NUM + (SYS_NUM if full else [])
              pre = ColumnTransformer([
                  ('num', Pipeline([('imp', SimpleImputer(strategy='median')),('sc', StandardScaler())]), nums),
                  ('cat', OneHotEncoder(handle_unknown='ignore'), ['rule_class']),
              ])
              return Pipeline([('pre', pre), ('ridge', Ridge(alpha=1.0))])

          groups = np.array([r['position_id'] for r in rows])
          y = np.array([r['regret'] for r in rows], dtype=float)
          X = pd.DataFrame(rows)
          n_splits = min(5, len(np.unique(groups)))
          if n_splits < 2: raise SystemExit('TOO_FEW_GROUPS')
          pred0 = np.full(len(rows), np.nan); pred1 = np.full(len(rows), np.nan)
          for train, test in GroupKFold(n_splits=n_splits).split(X, y, groups):
              m0, m1 = make_model(False), make_model(True)
              m0.fit(X.iloc[train], y[train]); m1.fit(X.iloc[train], y[train])
              pred0[test] = m0.predict(X.iloc[test]); pred1[test] = m1.predict(X.iloc[test])

          def pairwise_accuracy(class_filter=None, eps=0.01):
              by = collections.defaultdict(list)
              for i,r in enumerate(rows):
                  if class_filter is None or r['rule_class'] in class_filter:
                      by[r['position_id']].append(i)
              def one(pred):
                  correct=total=ties=0.0
                  for ids in by.values():
                      for a in range(len(ids)):
                          for b in range(a+1,len(ids)):
                              i,j=ids[a],ids[b]; dt=y[i]-y[j]
                              if abs(dt)<eps: continue
                              dp=pred[i]-pred[j]; total+=1
                              if abs(dp)<1e-12: correct+=0.5; ties+=1
                              elif (dt>0)==(dp>0): correct+=1
                  return {'accuracy':correct/total if total else None,'pairs':int(total),'prediction_ties':int(ties)}
              return one(pred0), one(pred1)

          def metric_block(mask):
              yy=y[mask]; p0=pred0[mask]; p1=pred1[mask]
              mae0=mean_absolute_error(yy,p0); mae1=mean_absolute_error(yy,p1)
              out={'n_moves':int(mask.sum()),'n_positions':int(len(set(groups[mask]))),
                   'mae_baseline':float(mae0),'mae_full':float(mae1),
                   'mae_improvement_fraction':float((mae0-mae1)/mae0) if mae0 else None,
                   'r2_baseline':float(r2_score(yy,p0)),'r2_full':float(r2_score(yy,p1)),
                   'spearman_baseline':float(spearmanr(yy,p0).statistic),
                   'spearman_full':float(spearmanr(yy,p1).statistic)}
              labels=np.array([r['harmful_025'] for r in rows])[mask]
              if len(np.unique(labels))==2:
                  out['auc_harmful_baseline']=float(roc_auc_score(labels,p0)); out['auc_harmful_full']=float(roc_auc_score(labels,p1))
              return out

          allmask=np.ones(len(rows),dtype=bool)
          p0,p1=pairwise_accuracy()
          o0,o1=pairwise_accuracy(OUTCOME_ONLY)
          per_class={}
          for rid in TARGET_CLASSES:
              mask=np.array([r['rule_class']==rid for r in rows])
              if mask.sum()==0: continue
              c0,c1=pairwise_accuracy({rid})
              per_class[rid]={**metric_block(mask),'pairwise_baseline':c0,'pairwise_full':c1}

          result={
              'test':'FUNCTIONAL-VIABILITY-P2-FROZEN-SHADOW',
              'scope':'natural T+ threat-family items with >=2 preserved B-move evaluations',
              'engine_searches_run':0,
              'classes':TARGET_CLASSES,
              'item_counts':dict(item_counts),'move_counts':dict(move_counts),'missing_move_evaluations':missing_eval,
              'primary_held_out_positions':metric_block(allmask),
              'primary_within_position_pairwise':{'baseline':p0,'full_systemic':p1,'gain':None if p1['accuracy'] is None else p1['accuracy']-p0['accuracy']},
              'stress_test_outcome_only_RC07_08_09':{'baseline':o0,'full_systemic':o1,'gain':None if o1['accuracy'] is None else o1['accuracy']-o0['accuracy'],
                  'why':'These predicates already require the threat to be answered; viability cannot win merely by detecting failure to answer it.'},
              'per_class':per_class,
              'decision_rule':{
                  'P2_supported_if':'held-out systemic model improves within-position ranking above baseline tie rate; gain is not confined to one class; outcome-only stress test remains >0.5',
                  'P2_not_supported_if':'no held-out within-position gain, or gain is confined to method classes where viability merely detects failure to resolve the threat',
                  'limit':'Only moves inside B have individual engine values; this tests ranking/safety among permitted actions, not selection among all legal moves.'}
          }
          print('===P2_RESULT_BEGIN==='); print(json.dumps(result,indent=2,sort_keys=True)); print('===P2_RESULT_END===')
          PY
