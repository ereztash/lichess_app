name: Functional Viability P2 Shadow

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis-only dependencies
        run: python -m pip install --quiet python-chess==1.999 zstandard pandas scikit-learn scipy
      - name: Run adversarial decomposition of frozen P2 shadow test
        run: |
          python - <<'PY'
          import collections, io, json, sys
          from pathlib import Path
          import numpy as np
          import chess, zstandard, pandas as pd
          from sklearn.compose import ColumnTransformer
          from sklearn.impute import SimpleImputer
          from sklearn.linear_model import Ridge
          from sklearn.metrics import mean_absolute_error, r2_score
          from sklearn.model_selection import GroupKFold
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import OneHotEncoder, StandardScaler

          sys.path.insert(0, str(Path('research/measurement').resolve()))
          import rule_classes as rc

          CORPUS=Path('research/learning-v3/corpus')
          TARGET=['RC-04','RC-07','RC-08','RC-09','RC-11','RC-18','RC-20']
          OUTCOME={'RC-07','RC-08','RC-09'}
          METHOD={'RC-04','RC-11','RC-18'}
          SEED=20260902

          def stream(name):
              with open(CORPUS/name,'rb') as fh:
                  reader=zstandard.ZstdDecompressor().stream_reader(fh)
                  for line in io.TextIOWrapper(reader,encoding='utf-8'):
                      yield json.loads(line)

          best={}
          for it in stream('item_bank.jsonl.zst'):
              if it.get('twin_of') or it.get('sham_of'): continue
              if it.get('trigger_state')!='positive' or it.get('rule_class') not in TARGET: continue
              k=(it['rule_class'],it['position_id'])
              if k not in best or it.get('run_id')=='sf171-full-corpus': best[k]=it
          items=list(best.values())

          move_eval=collections.defaultdict(dict)
          for e in stream('engine_evaluations.jsonl.zst'):
              if e.get('kind')!='move' or e.get('policy')!='multipv-over-B' or e.get('xs') is None: continue
              u=(e.get('moves') or [None])[0]
              if u: move_eval[e['position_id']][u]=float(e['xs'])

          def focal(board,rid):
              if rid=='RC-04':
                  h=rc._attacked_piece(board); return None if h is None else h[0]
              h=rc._designated_threat(board); return None if h is None else h[0]

          def sysmetrics(board,move,q0):
              actor=board.turn
              pre_s=len(board.attackers(actor,q0)); pre_c=len(board.attackers(not actor,q0))
              q1=move.to_square if move.from_square==q0 else q0
              b=board.copy(stack=False); b.push(move)
              p=b.piece_at(q1); exists=p is not None and p.color==actor
              post_s=len(b.attackers(actor,q1)) if exists else 0
              post_c=len(b.attackers(not actor,q1)) if exists else 0
              return {
                  'delta_pressure':(post_s-post_c)-(pre_s-pre_c),
                  'goal_path_viability_after':int(exists and not rc._in_bad_spot(b,q1,actor)),
                  'support_redundancy_after':post_s,
                  'constraint_concentration_after':post_c,
              }

          rows=[]; missing=0
          for it in items:
              rid=it['rule_class']; board=chess.Board(it['fen']); q=focal(board,rid)
              if q is None: continue
              avail=[]
              for m in rc.BY_ID[rid].satisfying_moves(board,rc.EMPTY_CONTEXT):
                  xs=move_eval.get(it['position_id'],{}).get(m.uci())
                  if xs is None: missing+=1
                  else: avail.append((m,xs))
              if len(avail)<2 or it.get('v_star_xs') is None: continue
              for m,xs in avail:
                  rows.append({
                    'position_id':it['position_id'],'rule_class':rid,'move':m.uci(),
                    'regret':float(it['v_star_xs'])-xs,'v_star':float(it['v_star_xs']),
                    'n_legal':float(it.get('n_legal') or len(list(board.legal_moves))),
                    'material_balance':it.get('material_balance'),'piece_count':it.get('piece_count'),
                    **sysmetrics(board,m,q)})

          X=pd.DataFrame(rows); y=X['regret'].to_numpy(float); groups=X['position_id'].to_numpy()
          BASE=['v_star','n_legal','material_balance','piece_count']
          REL=['delta_pressure','support_redundancy_after','constraint_concentration_after']
          VIAB=['goal_path_viability_after']
          SPECS={'baseline':BASE,'viability_only':BASE+VIAB,'relational_only':BASE+REL,'full':BASE+VIAB+REL}

          def model(cols):
              return Pipeline([('pre',ColumnTransformer([
                  ('num',Pipeline([('imp',SimpleImputer(strategy='median')),('sc',StandardScaler())]),cols),
                  ('cat',OneHotEncoder(handle_unknown='ignore'),['rule_class'])])),('ridge',Ridge(alpha=1.0))])

          preds={k:np.full(len(rows),np.nan) for k in SPECS}
          folds=GroupKFold(n_splits=5)
          for tr,te in folds.split(X,y,groups):
              for name,cols in SPECS.items():
                  m=model(cols); m.fit(X.iloc[tr],y[tr]); preds[name][te]=m.predict(X.iloc[te])

          def pair_stats(pred, class_filter=None, eps=.01):
              by=collections.defaultdict(list)
              for i,r in enumerate(rows):
                  if class_filter is None or r['rule_class'] in class_filter: by[r['position_id']].append(i)
              pos=[]
              for pid,ids in by.items():
                  correct=total=0.0
                  for a in range(len(ids)):
                      for b in range(a+1,len(ids)):
                          i,j=ids[a],ids[b]; dt=y[i]-y[j]
                          if abs(dt)<eps: continue
                          dp=pred[i]-pred[j]; total+=1
                          if abs(dp)<1e-12: correct+=.5
                          elif (dt>0)==(dp>0): correct+=1
                  if total: pos.append((pid,correct,total))
              c=sum(x[1] for x in pos); n=sum(x[2] for x in pos)
              return {'accuracy':c/n if n else None,'pairs':int(n),'positions':len(pos),'by_position':pos}

          rng=np.random.default_rng(SEED)
          def boot_ci(stat_a,stat_b=None,B=2000):
              # cluster bootstrap at position level; if b supplied, return CI for accuracy difference a-b
              amap={p:(c,n) for p,c,n in stat_a['by_position']}
              bmap={p:(c,n) for p,c,n in stat_b['by_position']} if stat_b else None
              ids=np.array(sorted(set(amap) & (set(bmap) if bmap else set(amap))))
              vals=[]
              for _ in range(B):
                  samp=rng.choice(ids,size=len(ids),replace=True)
                  ca=na=cb=nb=0.0
                  for p in samp:
                      c,n=amap[p]; ca+=c; na+=n
                      if bmap:
                          c2,n2=bmap[p]; cb+=c2; nb+=n2
                  va=ca/na
                  vals.append(va-(cb/nb) if bmap else va)
              lo,hi=np.quantile(vals,[.025,.975])
              return [float(lo),float(hi)]

          def block(filterset=None):
              stats={name:pair_stats(pred,filterset) for name,pred in preds.items()}
              clean={k:{kk:vv for kk,vv in v.items() if kk!='by_position'} for k,v in stats.items()}
              for name in ('viability_only','relational_only','full'):
                  clean[name]['gain_vs_baseline']=clean[name]['accuracy']-clean['baseline']['accuracy']
                  clean[name]['gain_ci95_cluster']=boot_ci(stats[name],stats['baseline'])
              return clean

          per_class={rid:block({rid}) for rid in TARGET}
          mae={}
          for name,p in preds.items():
              mae[name]={'mae':float(mean_absolute_error(y,p)),'r2':float(r2_score(y,p))}

          result={
            'test':'FUNCTIONAL-VIABILITY-P2-ADVERSARIAL-DECOMPOSITION',
            'engine_searches_run':0,'seed':SEED,'n_moves':len(rows),'n_positions':len(set(groups)),'missing_move_evaluations':missing,
            'overall':block(),
            'outcome_only_RC07_08_09':block(OUTCOME),
            'method_classes_RC04_11_18':block(METHOD),
            'per_class':per_class,'held_out_global_metrics':mae,
            'interpretation_guard':{
              'deep_relational_support_requires':'relational_only gain above zero with cluster CI excluding zero, especially in outcome-only classes where every B move already resolves the threat',
              'mere_action-validity_signature':'viability_only explains most of the full gain and relational_only is near chance/outcome-only null',
              'scope_limit':'individual engine values exist only for B moves; no claim about choosing among all legal moves'}
          }
          print('===P2_DECOMP_BEGIN==='); print(json.dumps(result,indent=2,sort_keys=True)); print('===P2_DECOMP_END===')
          PY
