name: Chess.com Cross-Platform Replication

on:
  pull_request:
    paths:
      - "research/mechanism/chesscom/CROSS_PLATFORM_PREREG.md"
      - "research/mechanism/chesscom/replicate_prelearning.py"
      - "research/mechanism/chesscom/chess_com_games_2026-09-06.pgn.gz.b64"
      - ".github/workflows/chesscom-cross-platform-replication.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chesscom-replication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  board-mechanism-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install replication dependencies
        run: python -m pip install --disable-pip-version-check numpy python-chess

      - name: Reconstruct and verify frozen PGN
        run: |
          set -euo pipefail
          base64 -d research/mechanism/chesscom/chess_com_games_2026-09-06.pgn.gz.b64 \
            | gzip -d > /tmp/chesscom.pgn
          echo "ae40fa2bd655a49b32aabd146f960ac6e2cf771452cf05a6ee4bc22b7ca646ca  /tmp/chesscom.pgn" \
            | sha256sum -c -
          test "$(grep -c '^\[Event ' /tmp/chesscom.pgn)" -eq 50
          if grep -Eq '\[%clk|\[%emt' /tmp/chesscom.pgn; then
            echo 'Unexpected move-clock annotation: preregistration no longer matches source' >&2
            exit 1
          fi

      - name: Install exact research engine — Stockfish 17.1 AVX2
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-ubuntu-x86-64-avx2.tar \
            -o /tmp/stockfish.tar
          mkdir -p /tmp/sf
          tar -xf /tmp/stockfish.tar -C /tmp/sf
          SF_BIN="$(find /tmp/sf -type f -name 'stockfish-ubuntu-x86-64-avx2' | head -1)"
          test -n "$SF_BIN"
          chmod +x "$SF_BIN"
          "$SF_BIN" bench 1 1 3 default depth >/tmp/sf-bench.txt 2>&1 || true
          echo "SF_BIN=$SF_BIN" >> "$GITHUB_ENV"

      - name: Execute frozen board-only cross-platform replication
        run: |
          set -euo pipefail
          python research/mechanism/chesscom/replicate_prelearning.py \
            --pgn /tmp/chesscom.pgn \
            --engine "$SF_BIN" \
            --book-keys research/b3_population_expertise/src/opening_book_keys.json \
            --out /tmp/chesscom_replication.json \
            | tee /tmp/chesscom_replication.stdout

      - name: Deposit result in job summary
        if: always()
        run: |
          if [ -f /tmp/chesscom_replication.json ]; then
            echo '## Frozen Chess.com replication result' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/chesscom_replication.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: chesscom-cross-platform-replication
          path: /tmp/chesscom_replication.json
          if-no-files-found: ignore
