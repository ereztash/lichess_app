name: Human Cue N1 Prepare

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis-only dependencies
        run: python -m pip install --quiet python-chess==1.999 zstandard pandas scikit-learn
      - name: Prepare runner-only path aliases
        run: ln -s research/learning-v3 learning-v3
      - name: Build frozen P4 cue and hidden bank
        env:
          PYTHONPATH: research/measurement
        run: python research/learning-v3/p4_n1_prepare.py
      - uses: actions/upload-artifact@v4
        with:
          name: p4-n1-hidden-bank
          path: research/learning-v3/p4_n1_bank.json
          if-no-files-found: error
          retention-days: 30
