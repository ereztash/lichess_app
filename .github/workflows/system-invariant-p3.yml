name: System Invariant P3 Frozen Experiment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis-only dependencies
        run: python -m pip install --quiet python-chess==1.999 zstandard pandas scikit-learn
      - name: Run frozen P3 cross-rule system-invariant experiment
        env:
          PYTHONPATH: research/measurement
        run: python research/learning-v3/p3_system_invariant.py
