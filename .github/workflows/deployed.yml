name: Deployed

# THE RUNG BELOW THIS ONE ENDS AT THE BUILT ASSETS. `verify` proves source -> build -> Chromium and
# stops, because at the moment it runs there is nothing deployed to check: the deployment is a
# consequence of the merge it is gating. So the L6 checks live here instead of there, and they run
# when there IS an origin:
#
#   deployment_status  Vercel finishes a deployment and says which commit it came from. The
#                      deployment-specific URL may still be behind Vercel Authentication even for a
#                      production deployment, so the standing production check uses the project's
#                      public production alias and keeps the deployment event's SHA as the expected
#                      build identity.
#   schedule           once a day against production, because a deployment can stop being correct
#                      without anybody deploying -- an expired certificate, a changed alias, an
#                      edge config someone edited in a dashboard.
#   workflow_dispatch  for a one-off run against a preview or another explicit origin.
#
# IT DOES NOT GATE MERGES, and that is deliberate rather than lenient. A required check that cannot
# run until after the merge is a required check that blocks every pull request forever.

on:
  deployment_status:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      origin:
        description: "Origin to check (defaults to production)"
        required: false
        default: "https://lichessapp.vercel.app"
      # THE ROLLBACK'S EVIDENCE. Vercel's instant rollback emits no deployment_status, so the run
      # that would prove the alias now serves the good build never fires on its own. After a
      # rollback the operator dispatches this with the commit that was rolled back TO; a green run
      # bound to that SHA closes the incident, and a red one says the alias still serves the bad
      # build. docs/ROLLBACK.md is the procedure; this input is what makes it checkable.
      sha:
        description: "Commit the origin must be serving (40 hex). Empty = any coherent build."
        required: false
        default: ""

# Nothing here writes to the repository, opens an issue or touches a deployment. Read the checkout
# and no more; a token that can do nothing else is a token whose leak does nothing else.
permissions:
  contents: read

jobs:
  l6:
    # `deployment_status` fires for every state Vercel reports, for previews as well as production.
    #
    # ONLY PRODUCTION IS CHECKED AUTOMATICALLY. Preview deployment URLs are behind Vercel's
    # protection on this project. Production is different: the stable public alias is reachable
    # without the preview protection wall, while the event's deployment-specific URL can still
    # redirect to Vercel Authentication. Therefore the automatic production check deliberately
    # verifies `lichessapp.vercel.app` and binds what it sees to the SHA from the deployment event.
    # A preview can still be checked by hand through `workflow_dispatch` when a reachable origin or
    # an appropriate bypass path is supplied.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # PINNED TO A COMMIT, NOT A TAG. A tag can be moved to any commit by whoever holds the
      # action's repository; a SHA cannot. docs/DEPENDENCY_POLICY.md states the rule and Dependabot
      # proposes the bumps, with the version kept in the comment so a reader can tell what it is.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # ONE STATEMENT OF THE RUNTIME. `engines.node` in package.json is what Vercel builds and
          # runs the function on; reading it here means CI cannot quietly test a different major.
          node-version-file: package.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Name the origin and the commit it should be serving
        id: target
        # INPUTS THROUGH THE ENVIRONMENT, NOT INTERPOLATED INTO THE SCRIPT. `${{ inputs.x }}`
        # inside `run:` is pasted into the shell before it runs, so a crafted input is a command.
        # An environment variable is a value.
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.deployment.sha }}
          INPUT_ORIGIN: ${{ inputs.origin }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -e
          if [ "$EVENT_NAME" = "deployment_status" ]; then
            echo "origin=https://lichessapp.vercel.app" >> "$GITHUB_OUTPUT"
            echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "origin=${INPUT_ORIGIN:-https://lichessapp.vercel.app}" >> "$GITHUB_OUTPUT"
            # A dispatched run may name the commit it expects (the rollback case). A scheduled run
            # has none: production is whatever was last deployed, and asserting this checkout's
            # HEAD against it would fail every day that main moved. The suite says so rather than
            # passing quietly -- the claim is the weaker one.
            if [ -n "$INPUT_SHA" ] && ! echo "$INPUT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::sha must be 40 hex characters, got '$INPUT_SHA'"
              exit 1
            fi
            echo "sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"
          fi

      # THE CONTROL FIRST, so a suite that has stopped checking anything cannot report green on the
      # real origin. Same predicates, pointed at an origin known not to be this application; it MUST
      # fail. `!` inverts the exit code, exactly as `gates:controls` inverts its own.
      - name: L6 positive control (the same predicates against a wrong origin must go red)
        run: |
          if npx vitest run --config vitest.controls.config.ts \
               tests/fixtures/controls/deployed-origin.control.test.ts; then
            echo "::error::the L6 predicates PASSED against example.com. They are not checking this application."
            exit 1
          fi
          echo "control went red, as required"

      # THE SECOND CONTROL: the SHA binding itself. The rollback procedure closes on "a green run
      # bound to the good commit", which is worth nothing unless a run bound to the WRONG commit
      # goes red. Pure predicate, no origin needed; it must fail.
      - name: L6 positive control (the SHA binding must go red on a mismatch)
        run: |
          if npx vitest run --config vitest.controls.config.ts \
               tests/fixtures/controls/deployed-sha.control.test.ts; then
            echo "::error::the SHA binding PASSED on a mismatch. A failed rollback would report as a success."
            exit 1
          fi
          echo "control went red, as required"

      # THE ENGINE CONTROL NEEDS A BROWSER AND THE BUILT BUNDLE, and neither is needed by the other
      # two, so both are installed here rather than at the top of the job. The build is the fixture:
      # the control serves THIS repository's shipped assets under a policy that breaks them, so the
      # only thing that differs from the real deployment is the header.
      - name: Chromium and a build, for the engine control
        run: |
          npx playwright install --with-deps chromium || npx playwright install chromium
          npm run build

      # THE THIRD CONTROL: the engine probe (R-27). `worker-src 'self'` in the policy STRING is what
      # this suite used to assert, and R-09 -- a CSP that broke the worker -- was held by nothing
      # else. The probe starts the shipped Worker under the served headers, and it is worth having
      # only if it goes red when those headers forbid the engine. Two breaks, because they fail
      # differently: a blocked worker throws in milliseconds, while a policy with no wasm permission
      # lets the worker start and never compiles -- silent, and the one that would ship.
      - name: L6 positive control (the engine probe must go red on a policy that breaks the engine)
        run: |
          if npx vitest run --config vitest.controls.config.ts \
               tests/fixtures/controls/deployed-engine.control.test.ts; then
            echo "::error::the engine probe PASSED under policies that forbid the engine. It is not reading them."
            exit 1
          fi
          echo "control went red, as required"

      - name: L6 against the deployed origin
        env:
          DEPLOYED_ORIGIN: ${{ steps.target.outputs.origin }}
          DEPLOYED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -e
          # A skip here is a failure of this workflow, not a licence: the whole point of the job is
          # that DEPLOYED_ORIGIN is set. Empty means the event did not carry an origin.
          if [ -z "$DEPLOYED_ORIGIN" ]; then
            echo "::error::no origin to check -- the event carried none and no default applied"
            exit 1
          fi
          echo "checking $DEPLOYED_ORIGIN ${DEPLOYED_SHA:+for $DEPLOYED_SHA}"
          npx vitest run tests/deployment/
